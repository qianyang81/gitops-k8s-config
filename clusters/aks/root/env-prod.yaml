---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: env-prod
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-core
  interval: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: gitops-k8s-config
  path: ./clusters/aks/env/prod
