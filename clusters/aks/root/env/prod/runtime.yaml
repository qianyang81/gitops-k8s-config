---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: runtime-prod
  namespace: flux-system
spec:
  dependsOn:
    - name: vcluster-prod
  interval: 10m
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: gitops-k8s-config
  path: ./clusters/aks/env/prod
