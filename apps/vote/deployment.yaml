apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: vote
  name: vote
  namespace: app-vote 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vote
  template:
    metadata:
      labels:
        app: vote
    spec:
      containers:
      - image: gitopsdevacr.azurecr.io/vote:1.0.0
        name: vote
        ports:
        - containerPort: 80
          name: vote
