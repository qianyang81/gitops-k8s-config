---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: vcluster-prod
  namespace: flux-system
spec:
  dependsOn:
    - name: cluster-core
  interval: 1m
  prune: true
  wait: true
  timeout: 10m
  sourceRef:
    kind: GitRepository
    name: gitops-k8s-config
  path: ./clusters/aks/vclusters/prod
