apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../../base/result

images:
  - name: result-image
    newName: gitopsdevacr.azurecr.io/result
    newTag: 1.0.0

patches:
  - path: ./patches/deployment.yaml
    target:
      kind: Deployment
      name: result

  - path: ./patches/hpa.yaml
    target:
      kind: HorizontalPodAutoscaler
      name: result
