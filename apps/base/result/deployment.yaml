---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  namespace: app-result
  labels:
    app: result
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
    spec:
      containers:
        - name: result
          # Placeholder for image, to be replaced in overlays
          image: result-image
          ports:
            - name: http
              containerPort: 80
